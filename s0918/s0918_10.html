<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
성
    <title>학생적프로그램</title>

    <style>
        h2 {
            text-align: center;
        }

        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        table {
            width: 1000px;
            text-align: center;
            box-sizing: border-box;
            margin: 50px auto;
        }

        th {
            background: #efefef;
            height: 60px;
        }

        td {
            height: 40px;
        }

        input {
            width: 200px;
            height: 30px;
            margin: 5px;
            box-sizing: border-box;
        }

        .input-box {
            width: 300px;
            margin: 30px auto;
            text-align: center;
        }

        button {
            padding: 7px 15px;
            margin: 3px;
            cursor: pointer;
        }

        .update-btn {
            background-color: #ddd;
        }

        .delete-btn {
            background-color: #ffcccc;
        }
    </style>


    <script>

        // 학생 데이터를 저장하는 배열
        students = [];


        $(function(){

            // 페이지가 처음 실행될 때
            drawTable();

        });//제이쿼리


        // ==========================================
        // 학생 성적 저장
        // ==========================================
        function saveBtn(){

            let no = $("#no").val();
            let name = $("#name").val();
            let kor = $("#kor").val();
            let eng = $("#eng").val();
            let math = $("#math").val();


            // 입력값 확인
            if(no == ""){
                alert("번호를 입력하세요.");
                $("#no").focus();
                return;
            }

            if(name == ""){
                alert("이름을 입력하세요.");
                $("#name").focus();
                return;
            }

            if(kor == "" || eng == "" || math == ""){
                alert("모든 점수를 입력하세요.");
                return;
            }


            // 중복 번호 확인
            for(let i = 0; i < students.length; i++){

                if(students[i].no == no){

                    alert("이미 존재하는 번호입니다.");
                    $("#no").focus();

                    return;
                }
            }


            // 학생 객체 생성
            let student = {

                no: no,
                name: name,
                kor: Number(kor),
                eng: Number(eng),
                math: Number(math),

            };


            // 합계 계산
            student.total =
                student.kor +
                student.eng +
                student.math;


            // 평균 계산
            student.avg =
                student.total / 3;


            // 배열에 학생 추가
            students.push(student);


            // 입력창 초기화
            $("#no").val("");
            $("#name").val("");
            $("#kor").val("");
            $("#eng").val("");
            $("#math").val("");


            // 테이블 출력
            drawTable();


            alert("학생 성적이 저장되었습니다.");

        }



        // ==========================================
        // 학생 성적 출력
        // ==========================================
        function drawTable(){

            let html = "";


            // 등수를 계산하기 위해
            // 평균을 기준으로 정렬
            let ranking = [...students];


            ranking.sort(function(a, b){

                return b.total - a.total;

            });


            // 학생 데이터 출력
            for(let i = 0; i < students.length; i++){

                let student = students[i];


                // 현재 학생의 등수 찾기
                let rank = 1;

                for(let j = 0; j < ranking.length; j++){

                    if(student.no == ranking[j].no){

                        rank = j + 1;

                        break;
                    }
                }


                html += `
                    <tr>

                        <td>${student.no}</td>

                        <td>${student.name}</td>

                        <td>${student.kor}</td>

                        <td>${student.eng}</td>

                        <td>${student.math}</td>

                        <td>${student.total}</td>

                        <td>${student.avg.toFixed(2)}</td>

                        <td>${rank}</td>

                        <td>

                            <button
                                type="button"
                                class="update-btn"
                                onclick="updateBtn('${student.no}')">
                                수정
                            </button>

                            <button
                                type="button"
                                class="delete-btn"
                                onclick="deleteBtn('${student.no}')">
                                삭제
                            </button>

                        </td>

                    </tr>
                `;
            }


            // 테이블에 출력
            $("#tbody").html(html);

        }



        // ==========================================
        // 학생 성적 수정
        // ==========================================
        function updateBtn(no){

            // 번호로 학생 찾기
            let index = -1;


            for(let i = 0; i < students.length; i++){

                if(students[i].no == no){

                    index = i;

                    break;
                }
            }


            // 학생이 없는 경우
            if(index == -1){

                alert("학생을 찾을 수 없습니다.");

                return;
            }


            // 수정할 학생
            let student = students[index];


            // 기존 데이터를 입력창에 표시
            $("#no").val(student.no);
            $("#name").val(student.name);
            $("#kor").val(student.kor);
            $("#eng").val(student.eng);
            $("#math").val(student.math);


            // 저장 버튼을 수정 버튼으로 변경
            $("#saveBtn")
                .text("수정완료")
                .attr("onclick", "updateSaveBtn(" + index + ")");


            // 입력창으로 이동
            $("#no").focus();

        }



        // ==========================================
        // 수정 완료
        // ==========================================
        function updateSaveBtn(index){

            let no = $("#no").val();
            let name = $("#name").val();
            let kor = $("#kor").val();
            let eng = $("#eng").val();
            let math = $("#math").val();


            // 입력값 확인
            if(no == ""){
                alert("번호를 입력하세요.");
                return;
            }

            if(name == ""){
                alert("이름을 입력하세요.");
                return;
            }

            if(kor == "" || eng == "" || math == ""){
                alert("모든 점수를 입력하세요.");
                return;
            }


            // 번호 중복 확인
            for(let i = 0; i < students.length; i++){

                if(i != index && students[i].no == no){

                    alert("이미 존재하는 번호입니다.");

                    return;
                }
            }


            // 학생 정보 수정
            students[index].no = no;
            students[index].name = name;
            students[index].kor = Number(kor);
            students[index].eng = Number(eng);
            students[index].math = Number(math);


            // 합계 다시 계산
            students[index].total =
                students[index].kor +
                students[index].eng +
                students[index].math;


            // 평균 다시 계산
            students[index].avg =
                students[index].total / 3;


            // 입력창 초기화
            clearInput();


            // 저장 버튼 원래대로 변경
            $("#saveBtn")
                .text("저장")
                .attr("onclick", "saveBtn()");


            // 테이블 다시 출력
            drawTable();


            alert("학생 성적이 수정되었습니다.");

        }



        // ==========================================
        // 학생 성적 삭제
        // ==========================================
        function deleteBtn(no){

            // 삭제 확인
            let result = confirm(
                "정말 삭제하시겠습니까?"
            );


            if(result == false){

                return;

            }


            // 번호로 학생 찾기
            for(let i = 0; i < students.length; i++){

                if(students[i].no == no){

                    // 배열에서 학생 삭제
                    students.splice(i, 1);

                    break;
                }
            }


            // 테이블 다시 출력
            drawTable();


            alert("학생 성적이 삭제되었습니다.");

        }



        // ==========================================
        // 입력창 초기화
        // ==========================================
        function clearInput(){

            $("#no").val("");
            $("#name").val("");
            $("#kor").val("");
            $("#eng").val("");
            $("#math").val("");

        }



        // ==========================================
        // 기존 AJAX 코드
        // ==========================================
        function getData(){

            $.ajax({

                url:"https://apis.data.go.kr/B551011/PhotoGalleryService1/galleryList1?serviceKey=918RE13GA7OY7ZEmUzApgbOeAcQoZ%2FaHsXWcqPAKQ9YNNPj83KOstRMRIUrCFIAcm9qj2R6b7NFZjp%2FYsYzJLg%3D%3D&numOfRows=10&pageNo=1&MobileOS=ETC&MobileApp=AppTest&arrange=A&_type=json",

                type:"get",

                data:{},

                dataType:"json",

                success:function(data){

                    alert("성공");

                    console.log(data.response.body.items.item);

                    // 서버에서 데이터를 받아서 변수에 저장
                    students = data.response.body.items.item;

                },

                error:function(){

                    alert("실패");

                }

            })

        }


    </script>

</head>


<body>

    <h2>학생성적프로그램</h2>


    <div class="input-box">

        <input
            type="text"
            name="no"
            id="no"
            placeholder="번호입력"
        >
        <br>


        <input
            type="text"
            name="name"
            id="name"
            placeholder="이름입력"
        >
        <br>


        <input
            type="text"
            name="kor"
            id="kor"
            placeholder="국어점수입력"
        >
        <br>


        <input
            type="text"
            name="eng"
            id="eng"
            placeholder="영어점수입력"
        >
        <br>


        <input
            type="text"
            name="math"
            id="math"
            placeholder="수학점수입력"
        >
        <br>


        <button
            type="button"
            id="saveBtn"
            onclick="saveBtn()"
        >
            저장
        </button>


        <button
            type="button"
            onclick="clearInput()"
        >
            취소
        </button>

    </div>



    <table>

        <colgroup>

            <col width="10%">
            <col width="15%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="10%">
            <col width="15%">

        </colgroup>


        <thead>

            <tr>

                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>버튼</th>

            </tr>

        </thead>


        <tbody id="tbody">

        </tbody>

    </table>


</body>

</html>
