<style>

<h1>학생 성적 관리</h1>

<!-- 성적 입력 -->
<div class="input-box">

    <h2>학생 성적 입력</h2>

    <form class="form" id="scoreForm">

        <label for="no">번호</label>
        <input type="number" id="no" required>

        <label for="name">이름</label>
        <input type="text" id="name" required>

        <label for="kor">국어</label>
        <input type="number" id="kor" min="0" max="100" required>

        <label for="eng">영어</label>
        <input type="number" id="eng" min="0" max="100" required>

        <label for="math">수학</label>
        <input type="number" id="math" min="0" max="100" required>

        <button type="submit" class="btn">등록</button>

    </form>

</div>


<!-- 성적 목록 -->
<div class="list-box">

    <h2>학생 성적 목록</h2>

    <table>

        <thead>
            <tr>
                <th>번호</th>
                <th>이름</th>
                <th>국어</th>
                <th>영어</th>
                <th>수학</th>
                <th>합계</th>
                <th>평균</th>
                <th>등수</th>
                <th>관리</th>
            </tr>
        </thead>

        <tbody id="scoreList">

        </tbody>

    </table>

</div>
```

</div>

<script>

    const form = document.getElementById("scoreForm");
    const scoreList = document.getElementById("scoreList");

    let students = [];

    // 성적 등록
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const no = Number(document.getElementById("no").value);
        const name = document.getElementById("name").value;
        const kor = Number(document.getElementById("kor").value);
        const eng = Number(document.getElementById("eng").value);
        const math = Number(document.getElementById("math").value);

        const total = kor + eng + math;
        const avg = total / 3;

        const student = {
            no: no,
            name: name,
            kor: kor,
            eng: eng,
            math: math,
            total: total,
            avg: avg
        };

        students.push(student);

        displayStudents();

        form.reset();

    });


    // 학생 목록 출력
    function displayStudents() {

        // 합계 기준 내림차순 정렬
        students.sort(function(a, b) {
            return b.total - a.total;
        });

        scoreList.innerHTML = "";

        students.forEach(function(student, index) {

            const rank = index + 1;

            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${student.no}</td>
                <td>${student.name}</td>
                <td>${student.kor}</td>
                <td>${student.eng}</td>
                <td>${student.math}</td>
                <td>${student.total}</td>
                <td>${student.avg.toFixed(2)}</td>
                <td>${rank}</td>
                <td>
                    <button class="delete"
                        onclick="deleteStudent(${student.no})">
                        삭제
                    </button>
                </td>
            `;

            scoreList.appendChild(tr);

        });

    }


    // 학생 삭제
    function deleteStudent(no) {

        students = students.filter(function(student) {
            return student.no !== no;
        });

        displayStudents();

    }

</script>

</body>
