<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title></title>
        <style>
            div{width:100px; height:50px; border:3px solid black;}
            span{width:200px; height:100px; border:2px solid pink;}
            ul{list-style: disc;}  /* 주석 : none-블릿,disc-채워진 원,circle-테두리원,square-사각 */
            ol{list-style: upper-alpha;} /* decimal-숫자,alpha-영문자,roman-로마자 */
        </style>
    </head>

        <ol>

            <li>결제시작</li>
        </ol>
        <hr>
